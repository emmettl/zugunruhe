name: Provision LUFT Cloudflare credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare
    steps:
      - name: Encrypt deployment credential for LUFT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cat > recipient.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA2r7eulRoon4Ro1QTtdur
          VkpQ0REGYxd+daUN93YFPaeI1ccpBx7C3wvELxE4B8TgQvsc27VGPJ0M+OrVhVUs
          aGu+Vl4T/Ms8nQplz55j6b6I70G11x4Ks0UsocGjER5UWaOkEN88nnQOhgVx75e1
          fM9dF3iUzzyzXQsajguxQK6I5Vz7bp8727a8+smLnhCYq1BEbaoCE66l0dQYEuq5
          zQiEEWZnkj3mpz/XbZUtpt8KS3UiM0fJOxQaroQEG8DJ2clhtRGV0BaATEoq3Htj
          3sCwA625ACihToztU9ZHBOr6ykashpoHabjeYPafGsrvNRoir1AWjaKd0hk1gAw3
          wg95M+0usFrcrZknqUkclbX+U0KwQYm0VGW5m+bA6fOwEqp1UbzUx6+DbUL+KCo9
          nvNRUNT9XVakzmm14w5FRJuCnEbbqKnU0WR9k2OeAJ1bT+n7YHOOFjsNauFF6Fdh
          NK2/wNfmkUS2f1PyhwEobHBzftTImfkzaYXKbBnPr07LXwL9nH+nJwtPy+F57qtY
          zr3D3KwrG5qcpypXiZF4PtGJgOlRQF5py0ooFP7w+QBm5lHf2VNixfH5mJUDU8Bl
          W4GiL3203VcjI+IDJVLTB8FfPSn4WY941863OADSCBnxM1lJ1CqKZF6TjIIaGAmK
          k3q3RpN9zJx2h9Kv46x71LkCAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          printf '%s' "$CLOUDFLARE_API_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey recipient.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out credential.enc
      - uses: actions/upload-artifact@v4
        with:
          name: luft-encrypted-credential
          path: credential.enc
          retention-days: 1
